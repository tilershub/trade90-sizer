name: Refresh public research snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-public-research
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh compact research data
        run: node scripts/update-public-research.mjs
      - name: Commit when research changed
        run: |
          if git diff --quiet -- src/data/public-research.json; then
            echo "No research changes."
            exit 0
          fi
          git config user.name "trade90-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/public-research.json
          git commit -m "chore: refresh public research snapshot"
          git push
