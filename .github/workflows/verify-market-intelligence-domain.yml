name: Verify TRADE90 public Market Intelligence

on:
  push:
    branches: [main]
    paths:
      - "src/pages/market-intelligence.astro"
      - "functions/api/market-intelligence.js"
      - "functions/api/market-intraday.js"
      - ".github/workflows/verify-market-intelligence-domain.yml"
  workflow_dispatch:

jobs:
  public-domain-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify the custom domain serves the native Market Intelligence page
        shell: bash
        run: |
          for i in $(seq 1 14); do
            code=$(curl -L -sS --connect-timeout 10 --max-time 20 \
              -o /tmp/trade90-market-intelligence.html -w '%{http_code}' \
              https://tradeninety.com/market-intelligence/ || true)
            if [ "$code" = "200" ] && \
              grep -q 'Intraday market structure' /tmp/trade90-market-intelligence.html && \
              grep -q '/api/market-intelligence' /tmp/trade90-market-intelligence.html; then
              echo "TRADE90 market intelligence is visible on the public domain."
              exit 0
            fi
            echo "Attempt $i: status=$code; waiting for site deployment"
            sleep 15
          done
          echo "::error::New Market Intelligence content is not yet served by tradeninety.com."
          exit 1
      - name: Inspect the public research API response
        shell: bash
        run: |
          code=$(curl -L -sS --connect-timeout 10 --max-time 25 \
            -o /tmp/trade90-research-api.json -w '%{http_code}' \
            https://tradeninety.com/api/market-intelligence || true)
          echo "Public same-domain research API status: $code"
          if [ "$code" = "200" ]; then
            python3 -m json.tool /tmp/trade90-research-api.json >/dev/null
            grep -q '"markets"' /tmp/trade90-research-api.json
          else
            echo "::warning::Research API was unavailable during this request (possible backend cold start or source issue)."
          fi
