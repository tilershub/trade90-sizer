name: Market Intelligence production build

on:
  pull_request:
    paths:
      - "src/pages/market-intelligence.astro"
      - "src/pages/index.astro"
      - "src/components/Header.astro"
      - "src/components/MobileDock.astro"
      - "functions/api/market-intelligence.js"
      - "functions/api/market-intraday.js"
      - "tests/market-intelligence-browser.cjs"
      - ".github/workflows/check-market-intelligence.yml"
  workflow_dispatch:

jobs:
  astro-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate Cloudflare Pages function syntax
        run: |
          node --check functions/api/market-intelligence.js
          node --check functions/api/market-intraday.js
      - name: Build public Astro website
        run: npm run build
      - name: Confirm generated public route
        run: test -f dist/market-intelligence/index.html || test -f dist/market-intelligence.html
      - name: Launch Astro preview and browser smoke test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          (npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/trade90-astro-preview.log 2>&1 &)
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4321/market-intelligence/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/market-intelligence-browser.cjs
