name: Trade90 V2 verified rates and website build

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/trade90-v2.mjs"
      - "tests/trade90-v2-browser.cjs"
      - "astro.config.mjs"
      - ".github/workflows/check-market-intelligence.yml"
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Validate 28-pair policy-rate calculations
        run: node tests/trade90-v2.mjs
      - name: Build Astro website
        run: npm run build
      - name: Verify generated homepage, methodology and education routes
        run: |
          test -f dist/index.html
          test -f dist/methodology/index.html
          test -f dist/learn/index.html
          test -f dist/learn/what-is-interest-rate-divergence/index.html
          grep -q 'Central Bank Rate Divergence' dist/index.html
          grep -q 'Current rate gaps' dist/index.html
          grep -q 'Expected rate gaps' dist/index.html
          grep -q 'What changed' dist/index.html
          grep -q 'Currency pair details' dist/index.html
      - name: Desktop and mobile interaction checks
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          (npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/trade90-v2-preview.log 2>&1 &)
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/trade90-v2-browser.cjs
