name: Trade90 verified rates, V3 UX and SEO build

on:
  pull_request:
    paths:
      - "package.json"
      - "scripts/publish-sitemap.mjs"
      - "scripts/submit-indexnow.mjs"
      - "tests/indexnow.mjs"
      - ".github/workflows/indexnow-discovery.yml"
      - "tests/trade90-sitemap.mjs"
      - "tests/trade90-position-size.mjs"
      - "tests/trade90-position-size-browser.cjs"
      - "src/**"
      - "public/**"
      - "scripts/publish-forward-rates.mjs"
      - "tests/trade90-v2.mjs"
      - "scripts/auto-policy-rates.mjs"
      - "scripts/monitor-official-sources.mjs"
      - "tests/auto-policy-rates.mjs"
      - "tests/trade90-v2-browser.cjs"
      - "tests/trade90-v3.mjs"
      - "tests/trade90-v3-browser.cjs"
      - "tests/monitor-official-sources.mjs"
      - "tests/auto-policy-rates.mjs"
      - "scripts/auto-policy-rates.mjs"
      - "scripts/monitor-official-sources.mjs"
      - "tests/monitor-official-sources.mjs"
      - "scripts/monitor-official-sources.mjs"
      - "tests/trade90-reading-browser.cjs"
      - "tests/monitor-official-sources.mjs"
      - "scripts/monitor-official-sources.mjs"
      - ".github/workflows/monitor-official-sources.yml"
      - "tests/trade90-v3-build.mjs"
      - "astro.config.mjs"
      - ".github/workflows/check-market-intelligence.yml"
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Verify deterministic autonomous rate publication guards
        run: node tests/auto-policy-rates.mjs
      - name: Verify source watcher safety
        run: node tests/monitor-official-sources.mjs
      - name: Validate 28-pair policy-rate calculations
        run: node tests/trade90-v2.mjs
      - name: Validate eight-bank official publication monitoring and safe link parsing
        run: node tests/monitor-official-sources.mjs
      - name: Verify no unlicensed published forward rates
        run: node scripts/check-forward-publication.mjs
      - name: Verify autonomous central-bank source discovery and parser
        run: |
          node tests/monitor-official-sources.mjs
          node tests/auto-policy-rates.mjs
      - name: Validate V3 pair pages and source links
        run: node tests/trade90-v3.mjs
      - name: Validate automatic source monitoring safeguards
        run: node tests/monitor-official-sources.mjs
      - name: Verify IndexNow canonical page notification safety
        run: node tests/indexnow.mjs
      - name: Verify forex and gold position sizing risk calculations
        run: node tests/trade90-position-size.mjs
      - name: Verify policy forecast rules and quarterly freshness
        run: node tests/policy-model.mjs
      - name: Verify daily data freshness and manual-review provenance
        run: node tests/refresh-status.mjs
      - name: Build Astro website
        run: npm run build
      - name: Verify generated homepage, methodology and education routes
        run: |
          test -f dist/index.html
          test -f dist/methodology/index.html
          test -f dist/central-banks/index.html
          test -f dist/learn/index.html
          test -f dist/learn/what-is-interest-rate-divergence/index.html
          test -f dist/pairs/index.html
          test -f dist/pairs/eur-usd/index.html
          test -f dist/pairs/aud-chf/index.html
          test -f dist/rate-gaps/index.html
          test -f dist/decisions/index.html
          test -f dist/central-banks/fed/index.html
          test -f dist/central-banks/ecb/index.html
          test -f dist/data-policy/index.html
          test -f dist/tools/index.html
          test -f dist/tools/position-size-calculator/index.html
          grep -q 'Position Size Calculator' dist/tools/position-size-calculator/index.html
          grep -q 'YOUR DAILY RESEARCH ROUTINE' dist/index.html
          grep -q 'EUR/USD 90-Day Policy Rate Outlook' dist/pairs/eur-usd/index.html
          grep -q 'Next Major Decisions to Watch' dist/pairs/eur-usd/index.html
          grep -q 'Central Bank Policy Updates' dist/central-banks/index.html
      - name: Audit SEO and static V3 routes
        run: node tests/trade90-v3-build.mjs
      - name: Verify current sitemap.xml and canonical pages
        run: node tests/trade90-sitemap.mjs
      - name: Desktop and mobile interaction checks
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          (npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/trade90-v2-preview.log 2>&1 &)
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/trade90-v3-browser.cjs
          node tests/trade90-position-size-browser.cjs
          node tests/trade90-reading-browser.cjs
