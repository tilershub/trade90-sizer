name: TRADE90 hourly official-source watch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor-official-sources.yml"
      - "scripts/monitor-official-sources.mjs"
      - "scripts/auto-policy-rates.mjs"
      - "tests/monitor-official-sources.mjs"
      - "tests/auto-policy-rates.mjs"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: trade90-data-publication
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source scanner
        run: node tests/monitor-official-sources.mjs
      - name: Detect official releases and policy-source changes
        run: node scripts/monitor-official-sources.mjs
      - name: Verify autonomous policy publisher against deterministic official-source examples
        run: node tests/auto-policy-rates.mjs
      - name: Try verified official rate decisions automatically
        run: node scripts/auto-policy-rates.mjs
      - name: Validate published rates and 28 derived currency pairs
        run: |
          node tests/trade90-v2.mjs
          node tests/trade90-v3.mjs
      - name: Validate and record policy outlook
        run: |
          node tests/policy-model.mjs
          node scripts/build-policy-outlook.mjs
          node scripts/build-refresh-status.mjs
      - name: Commit verified rate changes and newly discovered bank links
        run: |
          git add public/data/refresh-status.json public/data/policy-outlook.json public/data/policy-outlook-history.json src/data/trade90-policy-snapshot.json public/data/official-source-monitor.json public/data/official-policy-automation.json public/data/official-release-feed.json public/data/official-rate-history.json
          if git diff --cached --quiet; then
            echo "No safely verified rate change or new publication links."
          else
            git config user.name "trade90-source-watch[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: autonomous source-linked official policy refresh"
            git push origin HEAD:main
          fi
      - name: Log new official publications (no routine human approval)
        run: |
          node -e "const r=require('/tmp/trade90-source-monitor-result.json'); console.log('Official source links automatically recorded:',r.changes.length)"
      - name: Alert on unverified policy decision documents, not publish them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(node -e "const r=require('/tmp/trade90-auto-rates-result.json'); console.log(r.failures.length)")
          if [ "$COUNT" -gt 0 ]; then
            EXISTING=$(gh issue list --state open --search '"TRADE90 policy parser requires attention" in:title' --json number --jq 'length' 2>/dev/null || echo 1)
            if [ "$EXISTING" = "0" ]; then
              node -e "const r=require('/tmp/trade90-auto-rates-result.json');const fs=require('fs');fs.writeFileSync('/tmp/trade90-rate-failures.md','Automatic rate publication withheld uncertain decisions. Existing rates were preserved.\n\n'+r.failures.map(e=>'- '+e.code+': '+e.state+' — '+e.url).join('\n'))"
              gh issue create --title "TRADE90 policy parser requires attention" --body-file /tmp/trade90-rate-failures.md || true
            fi
          fi
      - name: Report source failures without inventing updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const r=require('/tmp/trade90-source-monitor-result.json');if(r.failed.length)console.log('Sources needing adapter/availability review:',JSON.stringify(r.failed));"
          COUNT=$(node -e "const r=require('/tmp/trade90-source-monitor-result.json'); console.log(r.failed.length)")
          if [ "$COUNT" -gt 0 ]; then
            EXISTING=$(gh issue list --state open --search '"TRADE90 source watch coverage needs attention" in:title' --json number --jq 'length' 2>/dev/null || echo 1)
            if [ "$EXISTING" = "0" ]; then
              node -e "const r=require('/tmp/trade90-source-monitor-result.json');const fs=require('fs');fs.writeFileSync('/tmp/trade90-source-failures.md','Some official bank sources could not be read. Existing published rates were NOT changed.\n\n'+r.failed.map(e=>'- '+e.code+': '+e.error).join('\n')+'\n\nCheck the source adapter and official publication URL before relying on its automated coverage.');"
              gh issue create --title "TRADE90 source watch coverage needs attention" --body-file /tmp/trade90-source-failures.md || true
            fi
          fi
