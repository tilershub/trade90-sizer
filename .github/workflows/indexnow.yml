name: TRADE90 IndexNow crawl notifications

# Automatically notify IndexNow-supported engines after meaningful public page
# changes land on main. The public sitemap remains Google’s discovery method.
on:
  push:
    branches: [main]
    paths:
      - "src/pages/**"
      - "src/layouts/**"
      - "src/components/**"
      - "src/data/trade90-policy-snapshot.json"
      - "src/data/trade90-decision-calendar.js"
      - "src/data/trade90-policy-updates.js"
      - "src/data/trade90-policy-guidance.js"
      - "src/styles/**"
      - "public/indexnow-key.txt"
      - "public/_redirects"
      - "astro.config.mjs"
      - "scripts/publish-sitemap.mjs"
      - "scripts/indexnow-submit.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trade90-indexnow-production
  cancel-in-progress: true

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Build TRADE90 canonical sitemap
        run: |
          npm ci
          npm run build
          node tests/trade90-sitemap.mjs
          node tests/trade90-indexnow.mjs
          node scripts/indexnow-submit.mjs --dry-run
      - name: Wait for deployed site verification key and complete sitemap
        shell: bash
        run: |
          for attempt in $(seq 1 24); do
            if node scripts/indexnow-submit.mjs --check-live; then exit 0; fi
            echo "IndexNow public key or sitemap not published yet; retry $attempt/24"
            sleep 25
          done
          echo "::error::Cannot prove deployed domain ownership and sitemap. No indexing request sent."
          exit 1
      - name: Notify IndexNow-supported engines
        run: node scripts/indexnow-submit.mjs --submit
