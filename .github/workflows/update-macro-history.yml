name: Refresh country economic histories
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-macro-history.py
      - tests/macro-history.py
      - .github/workflows/update-macro-history.yml
permissions:
  contents: write
concurrency:
  group: trade90-macro-history
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tests/macro-history.py
      - name: Retrieve economic observations
        id: retrieve
        continue-on-error: true
        run: python scripts/update-macro-history.py
      - name: Validate and record policy outlook
        run: |
          node tests/policy-model.mjs
          node scripts/build-policy-outlook.mjs
      - name: Publish source-attributed observations
        run: |
          git add public/data/macro-history.json public/data/policy-outlook.json public/data/policy-outlook-history.json
          if ! git diff --cached --quiet; then
            git config user.name 'trade90-macro[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh country economic histories'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fail if retrieval failed
        if: steps.retrieve.outcome != 'success'
        run: |
          echo "::error::Economic data retrieval failed. Saved observations remain available with failure status."
          exit 1
