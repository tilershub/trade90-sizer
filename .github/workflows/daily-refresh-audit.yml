name: TRADE90 daily data refresh and publication
on:
  schedule:
    - cron: "43 5,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/daily-refresh.mjs"
      - "scripts/auto-policy-rates.mjs"
      - "scripts/build-policy-outlook.mjs"
      - "src/lib/trade90-policy-model.js"
      - "src/data/trade90-policy-guidance.js"
      - "src/data/trade90-policy-assessments.json"
      - "tests/policy-model.mjs"
      - "src/lib/trade90-refresh-status.js"
      - ".github/workflows/daily-refresh-audit.yml"
permissions:
  contents: write
concurrency:
  group: trade90-data-publication
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify data processing before retrieval
        run: |
          node tests/refresh-status.mjs
          node tests/auto-policy-rates.mjs
          node tests/monitor-official-sources.mjs
          python tests/macro-history.py
          python tests/policy-inputs.py
      - name: Retrieve and verify data, calculate outlooks and publish matching freshness report
        run: node scripts/daily-refresh.mjs
      - name: Validate published rate arithmetic and model
        run: |
          node tests/trade90-v2.mjs
          node tests/trade90-v3.mjs
          node tests/policy-model.mjs
      - name: Publish the complete daily update
        run: |
          git add public/data/ src/data/trade90-policy-snapshot.json src/data/trade90-yield-curves.json
          if ! git diff --cached --quiet; then
            git config user.name 'trade90-daily[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: publish complete daily research update'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify the daily update reached production
        run: node scripts/verify-daily-publication.mjs
      - name: Fail visibly if a retrieval stage failed
        run: |
          node -e "const r=require('./public/data/daily-update.json');if(r.status!=='completed'){console.error(r);process.exit(1)}"
