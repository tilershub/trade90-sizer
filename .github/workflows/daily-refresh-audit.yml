name: TRADE90 daily research freshness audit
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-refresh-status.mjs"
      - "src/lib/trade90-refresh-status.js"
      - "tests/refresh-status.mjs"
      - ".github/workflows/daily-refresh-audit.yml"
permissions:
  contents: write
  issues: write
concurrency:
  group: trade90-data-publication
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify daily freshness status classification
        run: node tests/refresh-status.mjs
      - name: Compile factual check, source health, and curated review dates
        run: node scripts/build-refresh-status.mjs
      - name: Publish research freshness status to the website source
        run: |
          git add public/data/refresh-status.json
          if git diff --cached --quiet; then
            echo "Freshness report unchanged."
          else
            git config user.name 'trade90-freshness[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: publish daily research freshness audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Open one review issue when stale or incomplete sources are detected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(node -e "const r=require('./public/data/refresh-status.json');console.log(r.warnings.length)")
          if [ "$COUNT" -gt 0 ]; then
            EXISTING=$(gh issue list --state open --search '"TRADE90 daily freshness needs review" in:title' --json number --jq 'length' 2>/dev/null || echo 1)
            if [ "$EXISTING" = "0" ]; then
              node -e "const fs=require('fs');const r=require('./public/data/refresh-status.json');fs.writeFileSync('/tmp/trade90-freshness-warnings.md','Daily data freshness audit '+r.auditedAt+' (UTC). Original manual review dates were not changed.\\n\\n'+r.warnings.map(w=>'- **'+w.category+'**: '+w.reason+' ['+w.status+']').join('\\n')+'\\n\\nCheck official bank sources and correct validated inputs before updating editorial review dates.');"
              gh issue create --title "TRADE90 daily freshness needs review" --body-file /tmp/trade90-freshness-warnings.md || true
            fi
          fi
      - name: Flag outdated curated research without changing its original review dates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('public/data/refresh-status.json')); console.log('Items requiring attention: '+x.warnings.length); for(const w of x.warnings) console.log(w.category+': '+w.reason);"
