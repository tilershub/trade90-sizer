name: Verify and update bond yield data
on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1-5'
permissions:
  contents: write
jobs:
  yield-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-yield-curves.mjs
      - name: Commit validated yield updates only
        run: |
          if git diff --quiet -- src/data/trade90-yield-curves.json; then
            echo "No validated yield observations to publish"
            exit 0
          fi
          git config user.name "trade90-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/trade90-yield-curves.json
          git commit -m "data: update licensed and verified bond yields"
          git push
